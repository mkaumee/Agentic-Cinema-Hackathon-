[project]
name = "supplier-sim"
version = "0.1.0"
description = "Adversary simulator. Separate service, own mailbox, talks to the agent only over email."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cinema-contracts",
    "google-genai>=1.0",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-cloud-firestore>=2.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "reportlab>=4.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
