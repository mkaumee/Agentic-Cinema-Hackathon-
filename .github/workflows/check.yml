name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Matches the uv_build pin in every member pyproject.
          version: "0.12.3"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --frozen

      # The Firestore emulator is a Java process that firebase-tools fetches.
      # Both are needed for the emulator-backed tests and for `make e2e`;
      # without them those 40-odd tests skip and CI would pass while proving
      # nothing about the guardrail.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install firebase-tools
        run: npm install --global firebase-tools@15

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint
        run: make lint

      - name: Types
        run: make types

      - name: Types (web)
        run: npx --prefix web tsc --noEmit --project web

      - name: Wall-clock guard
        run: make guard

      # A green run that skipped every Firestore test is worse than a red one,
      # because it looks like coverage. --strict-markers will not catch that,
      # so the skip count is checked directly: the emulator-backed tests skip
      # themselves when the emulator is unreachable, which is right locally and
      # unacceptable here.
      - name: Tests
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore,auth --project demo-cinema \
            "uv run pytest -q" 2>&1 | tee pytest.out
          if grep -qE "[0-9]+ skipped" pytest.out; then
            echo "::error::Emulator-backed tests skipped — an emulator did not come up."
            exit 1
          fi

      # The only thing in the repo that executes the rules files. Everything
      # else reaches Firestore through the admin SDK, which bypasses them.
      - name: Security rules
        run: make rules-test

      - name: End to end
        run: make e2e
